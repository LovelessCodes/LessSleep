name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  VALHEIM_MANAGED_DIR: ${{ github.workspace }}/.refs/valheim/valheim_server_Data/Managed
  BEPINEX_CORE_DIR: ${{ github.workspace }}/.refs/bepinex/BepInEx/core

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: ./.github/actions/prepare-refs

      - name: Build and package
        run: ./scripts/pack.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderstore-package
          path: dist/*.zip
          if-no-files-found: error
