name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.1). Must not exist on Thunderstore yet."
        required: true

permissions:
  contents: write

env:
  VALHEIM_MANAGED_DIR: ${{ github.workspace }}/.refs/valheim/valheim_server_Data/Managed
  BEPINEX_CORE_DIR: ${{ github.workspace }}/.refs/bepinex/BepInEx/core

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: ./.github/actions/prepare-refs

      - name: Resolve version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version $VERSION"

      - name: Stamp version into manifest and tcli config
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import json, pathlib, re, sys
          version = sys.argv[1]

          manifest = pathlib.Path("manifest.json")
          data = json.loads(manifest.read_text())
          data["version_number"] = version
          manifest.write_text(json.dumps(data, indent=2) + "\n")

          toml = pathlib.Path("thunderstore.toml")
          text = toml.read_text()
          text = re.sub(r'^versionNumber = ".*"$', f'versionNumber = "{version}"', text, flags=re.M)
          toml.write_text(text)
          PY
          grep -H 'version' manifest.json thunderstore.toml

      - name: Build and package
        run: ./scripts/pack.sh

      - name: Publish to Thunderstore (tcli)
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TCLI_AUTH_TOKEN:-}" ]; then
            echo "Missing repository secret TCLI_AUTH_TOKEN" >&2
            exit 1
          fi
          dotnet tool install -g tcli
          export PATH="$PATH:$HOME/.dotnet/tools"
          tcli publish --file "dist/LessCx-LessSleep-${VERSION}.zip" --package-version "${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
